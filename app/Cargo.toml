[package]
name = "stormsewer-app"
version = "0.9.3"
edition = "2021"
description = "StormSewer — standalone storm sewer design desktop application"
license = "GPL-3.0-or-later"
default-run = "StormSewer"

[[bin]]
name = "StormSewer"
path = "src/main.rs"

[dependencies]
stormsewer = { path = ".." }
# Both renderers are compiled in so startup can fall back: wgpu reaches DX12
# (and a software adapter) where OpenGL is unavailable — RDP, Citrix/VDI, VMs,
# and Microsoft's winget validation sandbox all lack a usable GL driver.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
] }
egui = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only switched on by --check-renderer, so a user who cannot start the app
# can produce a log that names the graphics adapters their machine offers.
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }