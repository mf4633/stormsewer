# Launches the real application on machines with no GPU.
#
# The headless test suite drives egui's CPU path and never touches a graphics
# backend, so it cannot catch a renderer that fails to initialise. That gap
# shipped: v0.9.1 could not start on any machine without an OpenGL driver —
# remote desktop, Citrix/VDI, virtual machines — and it took Microsoft's winget
# validation sandbox to find it.
#
# GitHub's runners have no GPU, which is exactly the environment that broke.
name: Startup smoke test

on:
  push:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/smoke.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: driver and runner-image changes break this, not our commits.
    - cron: "0 15 * * 2"

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers

      - name: Build
        run: cargo build --release -p stormsewer-app

      # A window still needs a display server, but there is no GPU behind it:
      # Mesa serves OpenGL through llvmpipe and Vulkan through lavapipe, both
      # pure software. That is the VDI case.
      - name: Start with no GPU (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/release/StormSewer --check-renderer

      - name: Start with no GPU (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/StormSewer --check-renderer

      # A GitHub Windows runner has no display driver: zero graphics adapters
      # (not even WARP) and only the generic OpenGL 1.1, so neither wgpu nor
      # glow can start on the hardware. That is exactly the machine the
      # bundled Mesa llvmpipe fallback exists for (app/src/software_gl.rs):
      # the installer ships Mesa's opengl32.dll + libgallium_wgl.dll and a
      # copy of the executable in `mesa\`, and StormSewer re-executes that
      # copy when the hardware renderers fail. Stage that layout here and
      # require the self-test to SUCCEED - on llvmpipe, by name.
      #
      # Release builds are windows_subsystem = "windows", so the shell does
      # not wait and $LASTEXITCODE stays 0; Start-Process -Wait is required.
      - name: Bundle Mesa llvmpipe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-mesa.ps1

      - name: Start on llvmpipe with no graphics adapter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = New-TemporaryFile
          $err = New-TemporaryFile
          $p = Start-Process -FilePath .\target\release\StormSewer.exe `
            -ArgumentList '--check-renderer' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $stdout = Get-Content $out -Raw
          $stderr = Get-Content $err -Raw
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host $stdout
          Write-Host $stderr
          if ($p.ExitCode -ne 0) {
            Write-Error "StormSewer did not start (exit $($p.ExitCode)); the Mesa fallback should have carried it"
            exit 1
          }
          if ($stdout -notmatch 'llvmpipe') {
            Write-Error 'started, but not on the bundled llvmpipe'
            exit 1
          }
          Write-Host '::notice::No adapter present; StormSewer started on the bundled Mesa llvmpipe.'

      # The forced path must work on any machine, GPU or not.
      - name: STORMSEWER_SOFTWARE_GL=1 goes straight to llvmpipe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STORMSEWER_SOFTWARE_GL: "1"
        run: |
          $out = New-TemporaryFile
          $p = Start-Process -FilePath .\target\release\StormSewer.exe `
            -ArgumentList '--check-renderer' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out
          $stdout = Get-Content $out -Raw
          Write-Host $stdout
          if ($p.ExitCode -ne 0 -or $stdout -notmatch 'llvmpipe') { exit 1 }

      - name: --version and --help must not open a window
        shell: bash
        run: |
          BIN=./target/release/StormSewer
          [ "${{ runner.os }}" = "Windows" ] && BIN=./target/release/StormSewer.exe
          "$BIN" --version | grep -q "StormSewer v"
          "$BIN" --help | grep -q -- "--check-renderer"
