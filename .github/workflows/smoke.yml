# Launches the real application on machines with no GPU.
#
# The headless test suite drives egui's CPU path and never touches a graphics
# backend, so it cannot catch a renderer that fails to initialise. That gap
# shipped: v0.9.1 could not start on any machine without an OpenGL driver —
# remote desktop, Citrix/VDI, virtual machines — and it took Microsoft's winget
# validation sandbox to find it.
#
# GitHub's runners have no GPU, which is exactly the environment that broke.
name: Startup smoke test

on:
  push:
    paths:
      - "app/**"
      - "src/**"
      - ".github/workflows/smoke.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: driver and runner-image changes break this, not our commits.
    - cron: "0 15 * * 2"

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers

      - name: Build
        run: cargo build --release -p stormsewer-app

      # A window still needs a display server, but there is no GPU behind it:
      # Mesa serves OpenGL through llvmpipe and Vulkan through lavapipe, both
      # pure software. That is the VDI case.
      - name: Start with no GPU (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/release/StormSewer --check-renderer

      - name: Start with no GPU (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/StormSewer --check-renderer

      # Windows ships no software rasteriser. A runner with no display
      # driver enumerates ZERO graphics adapters — not even WARP — and its
      # OpenGL is the generic 1.1 implementation, while glow needs 2.0+ and
      # wgpu's GL backend needs 3.3+. Linux passes the same test only
      # because Mesa provides llvmpipe. See ROADMAP.md, 'Software rendering
      # on Windows'.
      #
      # So on this runner StormSewer cannot start, and the behaviour worth
      # asserting is that it fails *correctly*: exits non-zero, promptly,
      # naming the cause — never hangs, crashes, or claims success. Release
      # builds are windows_subsystem = "windows", so the shell does not wait
      # and $LASTEXITCODE stays 0; an earlier version of this step passed
      # while its own log showed both renderers failing.
      - name: Fail cleanly with no graphics adapter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = New-TemporaryFile
          $err = New-TemporaryFile
          $p = Start-Process -FilePath .\target\release\StormSewer.exe `
            -ArgumentList '--check-renderer' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $stderr = Get-Content $err -Raw
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host $stderr
          if ($p.ExitCode -eq 0) {
            Write-Host '::notice::A graphics adapter was available and StormSewer started.'
            exit 0
          }
          if ($p.ExitCode -ne 1) {
            Write-Error "expected a clean exit code of 1, got $($p.ExitCode)"
            exit 1
          }
          if ($stderr -notmatch 'no graphics backend available') {
            Write-Error 'failed without explaining why'
            exit 1
          }
          Write-Host '::notice::No adapter present; StormSewer refused to start and said so.'


      - name: --version and --help must not open a window
        shell: bash
        run: |
          BIN=./target/release/StormSewer
          [ "${{ runner.os }}" = "Windows" ] && BIN=./target/release/StormSewer.exe
          "$BIN" --version | grep -q "StormSewer v"
          "$BIN" --help | grep -q -- "--check-renderer"
