# Builds and tests the Python bindings. The wheels are abi3, so one build per
# platform covers CPython 3.9 and every later version.
#
# Publishing to PyPI is deliberately manual (workflow_dispatch with publish),
# and needs the PYPI_API_TOKEN secret.
name: Python bindings

on:
  push:
    paths:
      - "python/**"
      - "src/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built wheels to PyPI"
        type: boolean
        default: false

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: universal2-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          # manylinux for portable Linux wheels; ignored on the other runners.
          manylinux: auto

      - name: Install and test the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links python/dist stormsewer
          # Run from the repo root so the tests can read examples/sample.ssn,
          # and so the installed wheel is imported rather than the source dir.
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*/*
