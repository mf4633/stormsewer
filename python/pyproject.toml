[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "stormsewer"
version = "0.9.2"
requires-python = ">=3.9"
description = "Storm sewer hydrology and hydraulics: Rational method, Manning, HGL/EGL backwater, HEC-22 inlets"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Michael Flynn" }]
keywords = ["hydrology", "hydraulics", "stormwater", "drainage", "civil-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/mf4633/stormsewer"
Source = "https://github.com/mf4633/stormsewer"
Issues = "https://github.com/mf4633/stormsewer/issues"

[tool.maturin]
# The Rust crate is stormsewer-python; the importable module is `stormsewer`.
module-name = "stormsewer"
features = ["pyo3/extension-module"]
