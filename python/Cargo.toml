# Detached from the parent workspace: maturin drives this build, and the
# workspace should not need a Python interpreter to run `cargo test`.
[workspace]

[package]
name = "stormsewer-python"
version = "0.9.2"
edition = "2021"
description = "Python bindings for the StormSewer hydrology and hydraulics engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/mf4633/stormsewer"
publish = false

[lib]
name = "stormsewer"
crate-type = ["cdylib"]

[dependencies]
# Aliased: the extension module is itself called `stormsewer`, so the engine
# needs a distinct name inside this crate.
engine = { package = "stormsewer", path = "..", default-features = false }
serde_json = "1"

[dependencies.pyo3]
version = "0.29"
# abi3-py39: one wheel works on CPython 3.9 and every later version, instead of
# a separate build per interpreter.
features = ["abi3-py39", "extension-module"]
